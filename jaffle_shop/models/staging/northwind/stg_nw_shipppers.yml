version: 2
models:
  - name: stg_nw_shippers
    description: "Northwinds shippers table"
    columns:
    - name: shipper_id
      description: "unique pk for shipper"
      data_tests:
        - unique
        - not_null
    - name: company_name
      description: "name of shipping company"
      data_tests:
        - not_null
    - name: phone
      description: "contact information"
      data_tests:
        - not_null
        
       
        